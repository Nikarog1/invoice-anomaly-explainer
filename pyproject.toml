[project]
name = "invoice-anomaly-explainer"
version = "0.1.0"
description = "Invoice anomaly explainer using agentic system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "chromadb",
    "pydantic",
    "pydantic-settings",
    "rapidfuzz",
    "fastapi[standard]",
    "uvicorn",
    "sqlmodel",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "ollama>=0.6.2",
]

[dependency-groups]
dev = [
    "pytest>=7,<9",
    "deptry==0.25.1",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.3,<1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q -m 'not smoke'"
asyncio_mode = "auto" # no need to manually decorate each async test
filterwarnings = [
    "ignore:coroutine.*was never awaited:RuntimeWarning",
    "ignore::DeprecationWarning:chromadb"
]
markers = ["smoke: end-to-end pipeline tests requiring Ollama and ChromaDB"]
pythonpath = ["."]
